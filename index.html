<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Moncef — Consultant CRM &amp; Martech · Portfolio</title>
  <meta name="description" content="Portfolio de Moncef, Consultant CRM & Martech (HubSpot) : le portail reproduit l'interface HubSpot pour présenter les clients accompagnés et les missions réalisées." />
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <!-- Topbar -->
  <header class="topbar">
    <svg class="topbar-sprocket" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <g fill="#ff5c35">
        <ellipse cx="24" cy="8" rx="6" ry="9"/>
        <ellipse cx="24" cy="8" rx="6" ry="9" transform="rotate(60 24 24)"/>
        <ellipse cx="24" cy="8" rx="6" ry="9" transform="rotate(120 24 24)"/>
        <ellipse cx="24" cy="8" rx="6" ry="9" transform="rotate(180 24 24)"/>
        <ellipse cx="24" cy="8" rx="6" ry="9" transform="rotate(240 24 24)"/>
        <ellipse cx="24" cy="8" rx="6" ry="9" transform="rotate(300 24 24)"/>
      </g>
      <circle cx="24" cy="24" r="6" fill="#0b0b0d"/>
    </svg>

    <div class="topbar-search">🔍 Trouver ou demander</div>
    <button class="topbar-add" aria-label="Ajouter">+</button>

    <div class="topbar-spacer"></div>

    <button class="topbar-upgrade">Mettre à niveau</button>
    <button class="topbar-icon" aria-label="Téléphone">📞</button>
    <button class="topbar-icon" aria-label="Marketplace">🧩</button>
    <button class="topbar-icon" aria-label="Aide">❓</button>
    <button class="topbar-icon" aria-label="Réglages">⚙️</button>
    <button class="topbar-icon" aria-label="Notifications">
      🔔<span class="topbar-bell-dot"></span>
    </button>
    <div class="topbar-sep"></div>
    <button class="topbar-assistant">✦ <span>Assistant</span></button>
    <div class="topbar-sep"></div>
    <button class="topbar-account">
      <span class="topbar-avatar">MB</span>
      <span>Portfolio Moncef Pro ▾</span>
    </button>
  </header>

  <!-- Sidebar -->
  <nav class="sidebar" aria-label="Navigation principale">
    <button class="sidebar-icon active" title="Contacts / Clients" aria-label="Contacts">🏢</button>
    <button class="sidebar-icon" title="Marketing" aria-label="Marketing">📣</button>
    <button class="sidebar-icon" title="Ventes" aria-label="Ventes">💼</button>
    <button class="sidebar-icon" title="Service client" aria-label="Service client">🎧</button>
    <button class="sidebar-icon" title="Automatisations" aria-label="Automatisations">⚙️</button>
    <button class="sidebar-icon" title="Rapports" aria-label="Rapports">📊</button>
  </nav>

  <!-- Vue principale -->
  <main class="main">
    <div id="view-root"></div>
  </main>

  <!-- Modal de bienvenue -->
  <div class="overlay hidden" id="welcome-overlay">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="welcome-title">
      <svg class="modal-sprocket" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <g fill="#ff5c35">
          <ellipse cx="24" cy="8" rx="6" ry="9"/>
          <ellipse cx="24" cy="8" rx="6" ry="9" transform="rotate(60 24 24)"/>
          <ellipse cx="24" cy="8" rx="6" ry="9" transform="rotate(120 24 24)"/>
          <ellipse cx="24" cy="8" rx="6" ry="9" transform="rotate(180 24 24)"/>
          <ellipse cx="24" cy="8" rx="6" ry="9" transform="rotate(240 24 24)"/>
          <ellipse cx="24" cy="8" rx="6" ry="9" transform="rotate(300 24 24)"/>
        </g>
        <circle cx="24" cy="24" r="6" fill="#0b0b0d"/>
      </svg>
      <h2 id="welcome-title">Bienvenue sur mon portail</h2>
      <p>Ce site reproduit l'interface de HubSpot, l'outil sur lequel je travaille chaque jour — son contenu, ce sont mes clients réels et ce que j'ai fait pour eux.</p>
      <div class="modal-actions">
        <button class="btn btn-primary" id="tour-guided-btn">Visite guidée (30 sec)</button>
        <button class="btn btn-secondary" id="explore-freely-btn">Explorer librement</button>
      </div>
    </div>
  </div>

  <!-- Tour guidé -->
  <div class="hidden" id="tour-overlay">
    <div class="tour-dim"></div>
    <div class="tour-ring" id="tour-ring"></div>
    <div class="tour-bubble" id="tour-bubble">
      <div class="tour-step-label" id="tour-step-label">Étape 1/5</div>
      <h3 id="tour-title">Titre</h3>
      <p id="tour-text">Texte</p>
      <div class="tour-bubble-actions">
        <button class="tour-skip" id="tour-skip-btn">Passer la visite</button>
        <button class="tour-next" id="tour-next-btn">Suivant →</button>
      </div>
    </div>
  </div>

  <!-- Bouton d'aide flottant -->
  <button class="help-fab pulse" id="help-fab" aria-label="Relancer la visite guidée">?</button>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
